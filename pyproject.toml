[project]
name = "ctgan"
version = "0.1.0"
description = "CTGAN (Huang & Wu, ICIP 2022) fork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "einops>=0.8",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "scikit-image>=0.24",
  "tensorboardx>=2.6",
  "tifffile>=2024.8",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
# Upstream CTGAN code keeps its own style.
extend-exclude = ["model", "dataset.py", "test.py", "train.py", "train_val_split.py", "utils.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

# cu126 wheels: the PyPI torch wheel targets CUDA 13, which needs a newer NVIDIA driver.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
